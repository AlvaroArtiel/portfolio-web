<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 44px;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(20,184,166,0.18), transparent 60%),
      radial-gradient(900px 600px at 85% 120%, rgba(20,184,166,0.10), transparent 60%),
      #0a0e0d;
    font-family: system-ui, sans-serif;
  }
  .phone {
    position: relative;
    width: 392px;
    height: 649px;
    border-radius: 40px;
    background: #111827;
    padding: 10px;
    box-shadow:
      0 40px 80px -20px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.06),
      inset 0 0 0 2px rgba(255,255,255,0.04);
  }
  .phone::before {
    content: "";
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    width: 90px; height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.18);
    z-index: 2;
  }
  .phone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    border-radius: 31px;
    display: block;
  }
  /* Leve escalonado para dar ritmo */
  .phone.a { transform: translateY(24px) rotate(-3deg); }
  .phone.b { transform: translateY(-18px) scale(1.04); z-index: 3; }
  .phone.c { transform: translateY(24px) rotate(3deg); }
</style>
</head>
<body>
  <div class="phone a"><img src="11-demo-carta.jpeg" alt="" /></div>
  <div class="phone b"><img src="13-demo-propuesta-vp.jpeg" alt="" /></div>
  <div class="phone c"><img src="12-demo-recomendador.jpeg" alt="" /></div>
</body>
</html>
